<!DOCTYPE html>
<html>
<head>
    <title>Blood Donor Registration</title>
    <style>
        body {
            font-family: Arial;
            background: #fff1f1;
            margin: 0;
        }
        header {
            background: #c62828;
            color: white;
            text-align: center;
            padding: 25px;
        }
        .container {
            background: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px #ccc;
        }
        input:not([type="checkbox"]), select, button {
            width: 100%;
            padding: 12px;
            margin: 9px 0;
            box-sizing: border-box;
        }
        button {
            background: #c62828;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }
        h2 { color: #c62828; }
        .consent {
            display: block;
            margin: 12px 0;
        }
    </style>
</head>
<body>

<header>
    <h1>Blood Donor Registration</h1>
    <p>Donate Blood, Save Lives</p>
</header>

<div class="container">
    <h2>Register as a Donor</h2>

    <form id="donorForm">
        <input id="name" placeholder="Full Name" required>

        <input id="age" type="number"
               placeholder="Age (18 or above)"
               min="18" max="65" required>

        <select id="blood" required>
            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select>

        <input id="phone" type="tel"
               placeholder="Mobile Number"
               pattern="[0-9]{10}" required>

        <input id="city" placeholder="City / Location" required>

        <p><b>Notification Permission</b></p>

        <label class="consent">
            <input type="checkbox" id="sms">
            I agree to receive blood request SMS.
        </label>

        <label class="consent">
            <input type="checkbox" id="whatsapp">
            I agree to receive blood request WhatsApp messages.
        </label>

        <button type="submit" id="submitBtn">
            Register as Donor
        </button>
    </form>

    <p id="message"></p>
    <a href="index.html">Back to Home</a>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

// REPLACE THIS OBJECT WITH YOUR COPIED FIREBASE CONFIG
const firebaseConfig = {
    apiKey: "PASTE_YOUR_API_KEY",
    authDomain: "PASTE_YOUR_AUTH_DOMAIN",
    projectId: "PASTE_YOUR_PROJECT_ID",
    storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
    messagingSenderId: "PASTE_YOUR_SENDER_ID",
    appId: "PASTE_YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("donorForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const donor = {
        name: document.getElementById("name").value.trim(),
        age: Number(document.getElementById("age").value),
        blood: document.getElementById("blood").value,
        phone: document.getElementById("phone").value.trim(),
        city: document.getElementById("city").value.trim(),
        smsConsent: document.getElementById("sms").checked,
        whatsappConsent: document.getElementById("whatsapp").checked,
        createdAt: serverTimestamp()
    };

    if (!donor.smsConsent && !donor.whatsappConsent) {
        message.textContent =
            "Please select at least one notification permission.";
        return;
    }

    submitBtn.disabled = true;
    message.textContent = "Registering...";

    try {
        await addDoc(collection(db, "donors"), donor);

        message.textContent =
            "Registration successful! Thank you for donating.";

        form.reset();

    } catch (error) {
        console.error(error);
        message.textContent =
            "Registration failed: " + error.message;
    } finally {
        submitBtn.disabled = false;
    }
});
</script>

</body>
</html>
