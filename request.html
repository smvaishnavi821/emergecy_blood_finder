<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

// Copy your actual Firebase configuration from donor.html
const firebaseConfig = {
    apiKey: "AIzaSyBAu-HsXwy5IXed2D0Pos44etSuMK4j0-E",
    authDomain: "emergency-blood-finder-system.firebaseapp.com",
    projectId: "emergency-blood-finder-system",
    storageBucket: "emergency-blood-finder-system.firebasestorage.app",
    messagingSenderId: "490380735173",
    appId: "1:490380735173:web:acfb27b6fd644e353b36ac"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("requestForm")
.addEventListener("submit", async function(event) {
    event.preventDefault();

    const request = {
        patient: document.getElementById("patient").value,
        age: Number(document.getElementById("age").value),
        blood: document.getElementById("blood").value,
        units: Number(document.getElementById("units").value),
        hospital: document.getElementById("hospital").value,
        city: document.getElementById("city").value,
        phone: document.getElementById("phone").value,
        urgency: document.getElementById("urgency").value,
        createdAt: serverTimestamp()
    };

    const message = document.getElementById("message");

    try {
        await addDoc(collection(db, "requests"), request);

        message.textContent =
            "Your blood request has been submitted successfully!";

        document.getElementById("requestForm").reset();

    } catch (error) {
        console.error("Error:", error);
        message.textContent =
            "Request failed. Please try again.";
    }
});
</script>
